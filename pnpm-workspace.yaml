packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks postinstall/build scripts of third-party dependencies by
# default (supply-chain protection). Prisma's install scripts are what fetch
# the platform-specific query engine binaries (e.g. rhel-openssl-3.0.x for
# Vercel) — without this, `prisma generate` can silently end up without the
# engine it needs. sharp's build script compiles its native binary, used by
# Next.js image optimization.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - sharp
